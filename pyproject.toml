[project]
name = "grok2api"
version = "2.0.4.rc1"
description = "Grok2API rebuilt with FastAPI, fully aligned with the latest web call format. Supports streaming and non-streaming chat, image generation/editing, deep thinking, token pool concurrency, and automatic load balancing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "aiohttp-socks>=0.8.0",
    "aiomysql>=0.2.0",
    "asyncpg>=0.29.0",
    "certifi>=2024.2.2",
    "cryptography>=42.0.0",
    "curl-cffi>=0.7.0",
    "fastapi>=0.110.0",
    "granian>=1.6.0",
    "greenlet>=3.0.0",
    "loguru>=0.7.2",
    "orjson>=3.10.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.25",
    "starlette>=0.36.0",
    "tiktoken>=0.6.0",
    "tomli-w>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "typing-extensions>=4.8.0; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
]
